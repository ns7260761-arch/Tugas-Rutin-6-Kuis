<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Pengetahuan Umum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #161329;
    --bg-panel: #201c3d;
    --line: #38315f;
    --ink: #f1eeff;
    --ink-dim: #a49dc9;
    --accent: #b28cff;
    --good: #5fd99c;
    --bad: #ff7a7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 80% -10%, #2b2454 0%, var(--bg-deep) 55%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  main { width: 100%; max-width: 480px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--ink-dim);
    font-size: 14px;
    margin-top: 4px;
  }

  .scoreboard {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding: 12px 16px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    color: var(--ink-dim);
  }

  .scoreboard strong {
    color: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
  }

  #quiz-panel { margin-top: 20px; }

  .card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
  }

  .progress {
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 12px;
  }

  .question {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.35;
  }

  .options {
    list-style: none;
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .option-btn:disabled { cursor: default; }

  .option-btn.correct {
    border-color: var(--good);
    background: rgba(95, 217, 156, 0.12);
    color: var(--good);
  }

  .option-btn.wrong {
    border-color: var(--bad);
    background: rgba(255, 122, 122, 0.12);
    color: var(--bad);
  }

  .next-row { margin-top: 18px; display: flex; justify-content: flex-end; }

  .next-btn {
    background: var(--accent);
    color: #1a1330;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .next-btn:hover { opacity: 0.88; }
  .next-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .result-card { text-align: center; }

  .result-score {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 52px;
    font-weight: 700;
    margin-top: 8px;
  }

  .result-label { color: var(--ink-dim); font-size: 14px; margin-top: 4px; }

  .highscore-note {
    margin-top: 16px;
    font-size: 13px;
    color: var(--accent);
    background: rgba(178, 140, 255, 0.1);
    border: 1px solid rgba(178, 140, 255, 0.3);
    border-radius: 10px;
    padding: 10px 14px;
    display: inline-block;
  }

  .restart-btn {
    margin-top: 20px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .restart-btn:hover { border-color: var(--accent); }

  footer { margin-top: 28px; color: var(--ink-dim); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Kuis Pengetahuan Umum</h1>
  <p class="subtitle">Jawab semua soal, skor dihitung otomatis di akhir.</p>

  <div class="scoreboard">
    <span>Skor tertinggi: <strong id="high-score-display">0</strong></span>
    <span>Total soal: <strong id="total-display">0</strong></span>
  </div>

  <div id="quiz-panel"></div>

  <footer>Tugas Rutin 6 — Quiz App</footer>
</main>

<script>
  const QUESTIONS = [
    {
      question: 'Ibu kota Indonesia saat ini adalah?',
      options: ['Jakarta', 'Bandung', 'Surabaya', 'Nusantara'],
      answerIndex: 0
    },
    {
      question: 'Berapa hasil dari 12 x 8?',
      options: ['88', '96', '104', '90'],
      answerIndex: 1
    },
    {
      question: 'Planet terdekat dengan Matahari adalah?',
      options: ['Venus', 'Bumi', 'Merkurius', 'Mars'],
      answerIndex: 2
    },
    {
      question: 'HTML adalah singkatan dari?',
      options: [
        'Hyper Trainer Marking Language',
        'HyperText Markup Language',
        'Hyper Text Making Language',
        'Home Tool Markup Language'
      ],
      answerIndex: 1
    },
    {
      question: 'Elemen JavaScript untuk mendeklarasikan variabel yang tidak bisa diubah nilainya adalah?',
      options: ['var', 'let', 'const', 'static'],
      answerIndex: 2
    },
    {
      question: 'Samudra terluas di dunia adalah?',
      options: ['Atlantik', 'Hindia', 'Pasifik', 'Arktik'],
      answerIndex: 2
    }
  ];

  const STORAGE_KEY = 'quizAppHighScore';

  const quizPanel = document.getElementById('quiz-panel');
  const highScoreDisplay = document.getElementById('high-score-display');
  const totalDisplay = document.getElementById('total-display');

  const state = {
    currentIndex: 0,
    score: 0,
    hasAnsweredCurrent: false
  };

  const getHighScore = () => {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? parseInt(stored, 10) : 0;
    } catch (err) {
      return 0;
    }
  };

  const saveHighScoreIfNeeded = (finalScore) => {
    try {
      const current = getHighScore();
      if (finalScore > current) {
        localStorage.setItem(STORAGE_KEY, String(finalScore));
        return true;
      }
      return false;
    } catch (err) {
      return false;
    }
  };

  const initScoreboard = () => {
    highScoreDisplay.textContent = getHighScore();
    totalDisplay.textContent = QUESTIONS.length;
  };

  const buildOptionButton = (optionText, index) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.dataset.index = index;
    btn.textContent = optionText;
    li.appendChild(btn);
    return li;
  };

  const renderQuestion = () => {
    const currentQuestion = QUESTIONS[state.currentIndex];
    state.hasAnsweredCurrent = false;

    const card = document.createElement('div');
    card.className = 'card';

    const progress = document.createElement('div');
    progress.className = 'progress';
    progress.textContent = `Soal ${state.currentIndex + 1} dari ${QUESTIONS.length}`;

    const questionEl = document.createElement('div');
    questionEl.className = 'question';
    questionEl.textContent = currentQuestion.question;

    const optionsList = document.createElement('ul');
    optionsList.className = 'options';
    currentQuestion.options.forEach((opt, i) => {
      optionsList.appendChild(buildOptionButton(opt, i));
    });

    const nextRow = document.createElement('div');
    nextRow.className = 'next-row';
    const nextBtn = document.createElement('button');
    nextBtn.className = 'next-btn';
    nextBtn.id = 'next-btn';
    nextBtn.disabled = true;
    nextBtn.textContent = state.currentIndex === QUESTIONS.length - 1 ? 'Lihat Hasil' : 'Soal Berikutnya';
    nextRow.appendChild(nextBtn);

    card.append(progress, questionEl, optionsList, nextRow);
    quizPanel.innerHTML = '';
    quizPanel.appendChild(card);
  };

  const handleOptionClick = (event) => {
    const target = event.target.closest('.option-btn');
    if (!target || state.hasAnsweredCurrent) return;

    state.hasAnsweredCurrent = true;
    const chosenIndex = parseInt(target.dataset.index, 10);
    const currentQuestion = QUESTIONS[state.currentIndex];

    const allOptions = quizPanel.querySelectorAll('.option-btn');
    allOptions.forEach((btn) => {
      btn.disabled = true;
      const btnIndex = parseInt(btn.dataset.index, 10);
      if (btnIndex === currentQuestion.answerIndex) {
        btn.classList.add('correct');
      } else if (btnIndex === chosenIndex) {
        btn.classList.add('wrong');
      }
    });

    if (chosenIndex === currentQuestion.answerIndex) {
      state.score += 1;
    }

    const nextBtn = document.getElementById('next-btn');
    if (nextBtn) nextBtn.disabled = false;
  };

  const handleNextClick = (event) => {
    const target = event.target.closest('#next-btn');
    if (!target) return;

    if (state.currentIndex < QUESTIONS.length - 1) {
      state.currentIndex += 1;
      renderQuestion();
    } else {
      renderResult();
    }
  };

  const renderResult = () => {
    const isNewHighScore = saveHighScoreIfNeeded(state.score);
    highScoreDisplay.textContent = getHighScore();

    const card = document.createElement('div');
    card.className = 'card result-card';

    const label = document.createElement('div');
    label.className = 'result-label';
    label.textContent = 'Kuis selesai! Skor kamu:';

    const scoreEl = document.createElement('div');
    scoreEl.className = 'result-score';
    scoreEl.textContent = `${state.score} / ${QUESTIONS.length}`;

    card.append(label, scoreEl);

    if (isNewHighScore) {
      const note = document.createElement('div');
      note.className = 'highscore-note';
      note.textContent = 'Rekor baru! Skor tertinggi diperbarui.';
      card.appendChild(note);
    }

    const restartBtn = document.createElement('button');
    restartBtn.className = 'restart-btn';
    restartBtn.id = 'restart-btn';
    restartBtn.textContent = 'Ulangi Kuis';
    card.appendChild(document.createElement('br'));
    card.appendChild(restartBtn);

    quizPanel.innerHTML = '';
    quizPanel.appendChild(card);
  };

  const handleRestartClick = (event) => {
    const target = event.target.closest('#restart-btn');
    if (!target) return;

    state.currentIndex = 0;
    state.score = 0;
    state.hasAnsweredCurrent = false;
    renderQuestion();
  };

  quizPanel.addEventListener('click', (event) => {
    handleOptionClick(event);
    handleNextClick(event);
    handleRestartClick(event);
  });

  initScoreboard();
  renderQuestion();
</script>
</body>
</html>
